[project]
name = "krakadyl"
version = "0.1.0"
description = "An active-investigation agent for forensic work under time pressure."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
laya = [
    # Pinned exact, not >=, per the project's own supply-chain
    # discipline (docs/levels.md's "Untrusted content and supply
    # chain" section) — reviewed before pinning: see
    # docs/red-team-laya-integration.md for the due-diligence trail.
    "laya==0.4.15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Without this, newer setuptools refuses to guess which top-level
# directory is "the package" once demo/, docs/, frontend/, out/, and
# visual/ exist alongside krakadyl/ — found while setting up a venv for
# the Laya integration; this repo was never actually `pip install -e`d
# before, only run via sys.path tricks in the demo scripts and pytest's
# own rootdir resolution, so the gap was latent, not newly introduced.
include = ["krakadyl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

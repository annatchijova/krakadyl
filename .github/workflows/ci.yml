name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install locked environment manager
        run: python -m pip install --disable-pip-version-check uv==0.12.2

      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --extra api

      - name: Run Python tests
        run: uv run pytest -q tests --ignore=tests/test_laya_adapter.py

      # Boots the real app under a live uvicorn server and drives
      # GET + prepare + execute over HTTP — the one path TestClient cannot
      # reach. The OS-level `timeout` is the point: if the AnyIO worker-thread
      # hang ever regresses, this fails the job (exit 124) instead of hanging
      # it until the job timeout. Runs under the locked 3.11 environment, which
      # closes the delivery plan's "not yet proven under locked 3.11" caveat.
      - name: Live-server API smoke check
        run: timeout 90 uv run python tools/api_smoke.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
